    .gantt-name {

document.getElementById('footer-date').textContent = dateStr;

// Today % within current year
function todayPct() {
  const y = now.getFullYear();
  const start = new Date(y, 0, 1);
  const end   = new Date(y + 1, 0, 1);
  return ((now - start) / (end - start)) * 100;
}
const TODAY_PCT = todayPct();

const ganttEl = document.getElementById('gantt-rows');

PROJECTS.forEach(function(p) {
  const row = document.createElement('div');

  nm.className = 'gantt-name';
  nm.innerHTML = '<span class="gantt-name-icon">' + p.icon + '</span>' +
                 '<span class="gantt-name-text">' + p.ganttName + '</span>';

  const track = document.createElement('div');
  track.className = 'gantt-track';

  VLINES.forEach(function(pct) {
    const vl = document.createElement('div');
    vl.className = 'gantt-vline';
    vl.style.left = pct + '%';
    track.appendChild(vl);
  });

  const todayLine = document.createElement('div');
  todayLine.className = 'gantt-today';
  todayLine.style.left = TODAY_PCT + '%';
  track.appendChild(todayLine);

  if (p.barL !== null) {
    const bar = document.createElement('div');
    bar.className = 'gantt-bar' + (p.allDone ? ' gantt-bar-done' : '');
    bar.style.left    = p.barL + '%';
    bar.style.width   = p.barW + '%';
    bar.style.background = p.color;
    if (p.allDone) {
      const tag = document.createElement('span');
      tag.className = 'gantt-success-tag';
      tag.textContent = '✓ Success';
      bar.appendChild(tag);
    }
    track.appendChild(bar);
  } else {
    const ph = document.createElement('div');
    ph.className = 'gantt-tbd';
    ph.textContent = 'TBD';
    track.appendChild(ph);
  }

  row.appendChild(nm);
  row.appendChild(track);
  ganttEl.appendChild(row);

    div.className = 'section-group-label';
    div.textContent = p.section;
    cardsEl.appendChild(div);
  }

  const doneMs   = p.ms.filter(function(m){ return m.s === 'เสร็จแล้ว'; });
  const activeMs = p.ms.filter(function(m){ return m.s !== 'เสร็จแล้ว'; });
  const total     = p.ms.length;
  const doneCount = doneMs.length;
  const pct       = total > 0 ? Math.round(doneCount / total * 100) : 0;

  const card = document.createElement('div');
  card.className = 'proj-card';
  card.style.borderLeftColor = p.color;

  // Card header
  const hdr = document.createElement('div');
  hdr.className = 'proj-hdr';
  hdr.style.borderLeftColor = p.color;
  hdr.innerHTML =
    '<div class="proj-dot" style="background:' + p.color + '"></div>' +
    '<span class="proj-icon">' + p.icon + '</span>' +
    '<span class="proj-name">' + p.name + '</span>' +
    (total > 0
      ? '<div class="proj-progress">' +
          '<div class="prog-bar-wrap">' +
            '<div class="prog-bar-fill" style="width:' + pct + '%;background:' + p.color + '"></div>' +
          '</div>' +
          '<span class="prog-text">' + doneCount + '/' + total + ' (' + pct + '%)</span>' +
        '</div>'
      : '') +
    '<span class="proj-owner">' + p.owner + '</span>';
  card.appendChild(hdr);

  // Milestone body
  const body = document.createElement('div');
  body.className = 'ms-group';

  if (p.ms.length === 0) {
    const nm = document.createElement('div');
    nm.className = 'no-ms';
    nm.textContent = 'ยังไม่มี Milestone — อยู่ระหว่างวางแผนร่วมกับทีม Business';
    body.appendChild(nm);
  } else {
    // Done group (collapsed)
    if (doneMs.length > 0) {
      const toggle = document.createElement('div');
      toggle.className = 'done-toggle';
      toggle.setAttribute('role', 'button');
      toggle.innerHTML =
        '<i class="ti ti-circle-check" aria-hidden="true" style="color:#16a34a;font-size:15px;flex-shrink:0"></i>' +
        '<span class="done-toggle-text">เสร็จแล้ว ' + doneMs.length + ' ขั้นตอน — กดดูรายละเอียด</span>' +
        '<i class="ti ti-chevron-down done-chevron" aria-hidden="true"></i>';

      const list = document.createElement('div');
      list.className = 'done-ms-list';

      doneMs.forEach(function(m) {
        const r = document.createElement('div');
        r.className = 'ms-row done-row';
        r.innerHTML =
          '<span class="ms-num">' + m.n + '</span>' +
          '<span class="ms-name done-name">' + m.name + '</span>' +
          '<span class="ms-date">' + m.date + '</span>' +
          '<span class="badge b-done">เสร็จแล้ว</span>';
        list.appendChild(r);
      });

      toggle.addEventListener('click', function() {
        const isOpen = list.classList.toggle('open');
        toggle.querySelector('.done-chevron').classList.toggle('open', isOpen);
      });

      body.appendChild(toggle);
      body.appendChild(list);
    }

    // Active + pending (always visible)
    activeMs.forEach(function(m) {
      const r = document.createElement('div');
      r.className = 'ms-row';
      const bc = m.s === 'กำลังดำเนินการ' ? 'b-active' : 'b-wait';
      r.innerHTML =
        '<span class="ms-num">' + m.n + '</span>' +
        '<span class="ms-name">' + m.name + '</span>' +
        '<span class="ms-date">' + m.date + '</span>' +
        '<span class="badge ' + bc + '">' + m.s + '</span>';
      body.appendChild(r);
    });

    // All done note
    if (activeMs.length === 0) {
      const note = document.createElement('div');
      note.className = 'all-done-note';
      note.textContent = '✓ เสร็จสมบูรณ์ทุกขั้นตอน';
      body.appendChild(note);
    }
  }

  card.appendChild(body);
  cardsEl.appendChild(card);
});
</script>
</body>
</html>
